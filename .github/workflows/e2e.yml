name: E2E

on:
  # Same triggers as ci.yml, except that a pull request touching only Markdown skips the browser
  # tests (Issue #229): documents never reach the page. main always runs them after a merge.
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  # Browser E2E (Issue #34): slow, so it runs beside ci.yml's verify. Dummy sample data only.
  e2e:
    runs-on: ubuntu-latest
    # Playwright's own image (Issue #255): the browsers and the OS libraries/fonts are baked in, so
    # nothing comes from apt or the browser CDN. Its version must equal @playwright/test in the
    # lockfile (checked below). `--user 1001` is the runner's user, as in Playwright's CI docs.
    # The digest pins the content, which a tag alone does not. It is the multi-arch index's digest
    # (what `docker pull` printed in CI and the registry's Docker-Content-Digest): it fixes both
    # the amd64 and arm64 images, so it keeps working if the runner changes architecture.
    # A Playwright bump updates the version and the digest here together.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The image ships its own Node; .nvmrc stays the one Node the project runs on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Fail before the tests when the image and @playwright/test differ (a Playwright bump that
      # forgot the image above). The image records its version in /ms-playwright/.docker-info.
      - name: Check the image matches @playwright/test
        run: >-
          node -e "const fs = require('node:fs');
          const image = JSON.parse(fs.readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion;
          const pkg = require('@playwright/test/package.json').version;
          if (image !== pkg) { console.error('Playwright image ' + image + ' != @playwright/test ' + pkg); process.exit(1); }
          console.log('Playwright ' + pkg);"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
