name: E2E

on:
  # Same triggers as ci.yml, except that a pull request touching only Markdown skips the browser
  # tests (Issue #229): documents never reach the page. main always runs them after a merge.
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  # Browser E2E (Issue #34): slow, so it runs beside ci.yml's verify. Dummy sample data only.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # The browser is installed explicitly (never by a postinstall), cached per Playwright version.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
