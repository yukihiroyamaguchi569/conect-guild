name: CI

on:
  # Pull requests are checked on their own trigger; a push re-runs the checks only on main.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      # Build uses only public/snapshot.sample.json; dist/ is never published.
      - run: npm run build
