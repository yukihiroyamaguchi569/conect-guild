version: 2
updates:
  - package-ecosystem: 'npm'
    # Workspaces share the root package-lock.json.
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    # Do not propose versions published less than 7 days ago (CLAUDE.md).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    groups:
      # Minor and patch updates go into one PR; each major update gets its own PR.
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
