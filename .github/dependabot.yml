version: 2
updates:
  - package-ecosystem: 'npm'
    # Workspaces share the root package-lock.json.
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    # Do not propose versions published less than 7 days ago (CLAUDE.md).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    groups:
      # Minor and patch updates go into one PR; each major update gets its own PR.
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
        # Playwright gets a PR of its own: the E2E workflow pins its Docker image, whose tag and
        # digest must be bumped together with it by hand (.github/workflows/e2e.yml, Issue #289).
        exclude-patterns:
          - '@playwright/test'
    ignore:
      # TypeScript 7 breaks typescript-eslint, eslint-plugin-sonarjs and vue-tsc (Issue #289, PR #287).
      # Remove this once they support it.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
